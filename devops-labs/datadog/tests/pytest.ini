[pytest]
minversion = 7.0
testpaths = unit integration e2e
timeout = 180

# Default: run unit tests only (fast, no credentials needed)
# Override with: pytest -m "unit or integration" or pytest -m "all"
addopts =
    -v
    --tb=short
    --strict-markers
    -m "unit"
    --html=reports/test-report.html
    --self-contained-html

markers =
    unit: fast tests with no external dependencies
    agent: requires a running Datadog agent on localhost
    api: requires DD_API_KEY and DD_APP_KEY
    slow: takes more than 30 seconds (includes ingestion wait)
    e2e: full end-to-end tests against live Datadog account
