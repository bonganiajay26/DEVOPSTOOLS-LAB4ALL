# Example 02: Kustomize SecretGenerator + ConfigMapGenerator Patterns

---
# ── ConfigMapGenerator from multiple sources ─────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
# From literal key-value pairs
- name: app-config
  literals:
  - APP_ENV=production
  - LOG_LEVEL=warn
  - MAX_CONNECTIONS=500

# From a .env file
- name: feature-flags
  envs:
  - feature-flags.env   # Content: FEATURE_X=true\nFEATURE_Y=false

# From files (file name = key, file content = value)
- name: nginx-config
  files:
  - nginx.conf           # Key: "nginx.conf", Value: file content
  - mime.types=mime.types.txt  # Custom key name

# Merge with existing configmap
- name: api-config
  behavior: merge       # merge | replace | create
  literals:
  - EXTRA_KEY=extra-value

# Generate with no hash suffix (stable name)
generatorOptions:
  disableNameSuffixHash: false  # true = no hash, false = hash suffix added
  labels:
    generated-by: kustomize
  annotations:
    managed-by: gitops

---
# ── SecretGenerator (for non-production use; use External Secrets in prod) ───
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

secretGenerator:
# Opaque secret from literals
- name: db-credentials
  literals:
  - DB_USER=appuser
  - DB_HOST=postgres.database.svc.cluster.local
  type: Opaque

# Secret from files (good for TLS certs)
- name: tls-secret
  files:
  - tls.crt=certs/server.crt
  - tls.key=certs/server.key
  type: kubernetes.io/tls

# Docker registry secret
- name: registry-credentials
  literals:
  - .dockerconfigjson={"auths":{"ghcr.io":{"auth":"base64encodedcreds"}}}
  type: kubernetes.io/dockerconfigjson

---
# ── Advanced patch: multiple targets ─────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

patches:
# Add label to ALL deployments
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /metadata/labels/cost-center
      value: engineering

# Add resource limits to ALL containers in ALL deployments
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"

# Scale specific deployments differently
- target:
    kind: Deployment
    name: api-service
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 10

- target:
    kind: Deployment
    name: worker-service
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 5

# Add tolerations to all pods
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - key: spot
        operator: Exists
        effect: NoSchedule
