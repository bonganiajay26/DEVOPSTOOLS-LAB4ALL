# SLO Burn-Rate Alerting — The system that replaced manual threshold alerts
# Based on: Google SRE Workbook multi-window, multi-burn-rate algorithm
#
# Why burn-rate vs threshold:
#   Threshold alert "error_rate > 1%":
#     - Fires 300 times a month if error rate fluctuates around 1%
#     - Misses slow degradations (error rate 0.5% for 2 weeks = budget exhausted)
#
#   Burn-rate alert "consuming budget 14x too fast":
#     - Only fires when it actually matters
#     - Gives context: "at this rate you'll be out of budget in 2 days"
#     - Near zero false positives

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-burn-rate-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:

  # ── Recording rules (pre-compute for performance) ─────────────
  - name: slo-recording-rules
    interval: 1m
    rules:
    # Error rate over multiple windows
    - record: job:http_error_rate:ratio5m
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
        /
        sum(rate(http_requests_total[5m])) by (job)

    - record: job:http_error_rate:ratio1h
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[1h])) by (job)
        /
        sum(rate(http_requests_total[1h])) by (job)

    - record: job:http_error_rate:ratio6h
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[6h])) by (job)
        /
        sum(rate(http_requests_total[6h])) by (job)

    - record: job:http_error_rate:ratio30d
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[30d])) by (job)
        /
        sum(rate(http_requests_total[30d])) by (job)

    # Latency SLO: 95% requests under 300ms
    - record: job:http_latency_p95:5m
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
        )

    # Error budget remaining (30d window)
    # = (allowed_error_rate - actual_error_rate) / allowed_error_rate * 100
    - record: job:error_budget_remaining:pct
      expr: |
        ((0.001 - job:http_error_rate:ratio30d) / 0.001) * 100

    # Burn rate (how much faster than normal we're consuming budget)
    - record: job:slo_burn_rate:5m
      expr: job:http_error_rate:ratio5m / 0.001

    - record: job:slo_burn_rate:1h
      expr: job:http_error_rate:ratio1h / 0.001

  # ── Availability SLO: 99.9% ───────────────────────────────────
  # Error budget: 0.1% = 43.2 min/month
  - name: availability-slo-alerts
    rules:
    # SEV1: Fast burn — consuming 2% budget in 1 hour (14.4x burn rate)
    # At this rate: budget exhausted in ~2 days
    # Both 5m AND 1h windows must be high (reduces false positives)
    - alert: AvailabilitySLOFastBurn
      expr: |
        job:slo_burn_rate:5m > 14.4
        and
        job:slo_burn_rate:1h > 14.4
      for: 2m
      labels:
        severity: critical
        slo: availability
        page: "true"
      annotations:
        summary: "{{ $labels.job }} burning error budget 14x — exhausts in < 2 days"
        description: |
          Burn rate: {{ $value | humanize }}x normal.
          Error budget will be exhausted in approximately {{ div 1 $value | humanizeDuration }}.
          Immediate action required.
        runbook: https://wiki.company.com/runbooks/high-error-rate
        dashboard: https://grafana.company.com/d/slo-overview

    # SEV2: Slow burn — consuming 5% budget in 6 hours (6x burn rate)
    # At this rate: budget exhausted in ~5 days
    - alert: AvailabilitySLOSlowBurn
      expr: |
        job:slo_burn_rate:5m > 6
        and
        job:slo_burn_rate:6h > 6
      for: 15m
      labels:
        severity: warning
        slo: availability
        page: "false"
      annotations:
        summary: "{{ $labels.job }} burning error budget 6x — exhausts in ~5 days"
        description: |
          Sustained elevated error rate. Error budget at risk.
          Investigate during business hours.
        runbook: https://wiki.company.com/runbooks/high-error-rate

    # Error budget nearly exhausted (< 10% remaining)
    - alert: ErrorBudgetNearlyExhausted
      expr: job:error_budget_remaining:pct < 10
      for: 5m
      labels:
        severity: critical
        page: "true"
      annotations:
        summary: "{{ $labels.job }} error budget < 10% remaining this month"
        description: |
          Only {{ $value | humanize }}% of error budget remaining.
          Feature deployments should be paused until budget replenishes.
        action: "Recommend feature freeze until next month cycle"

  # ── Latency SLO: p95 < 300ms ──────────────────────────────────
  - name: latency-slo-alerts
    rules:
    - alert: LatencySLOViolation
      expr: job:http_latency_p95:5m > 0.3
      for: 5m
      labels:
        severity: warning
        slo: latency
      annotations:
        summary: "{{ $labels.job }} p95 latency {{ $value | humanizeDuration }} > 300ms SLO"
        description: "p95 latency is degraded. Investigate database queries, external dependencies, or resource saturation."

  # ── Deployment safety alerts ──────────────────────────────────
  - name: deployment-health
    rules:
    # Error rate spike after deployment (correlate with rollout events)
    - alert: PostDeploymentErrorSpike
      expr: |
        (
          job:http_error_rate:ratio5m > 0.05
          and
          (
            kube_deployment_status_observed_generation
            - kube_deployment_metadata_generation
          ) == 0
        )
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "Error spike after recent deployment of {{ $labels.deployment }}"
        description: "Error rate {{ $value | humanizePercentage }} may be related to recent deployment. Consider rollback."
        action: "kubectl rollout undo deployment/{{ $labels.deployment }} -n {{ $labels.namespace }}"

    # Rollout stalled (new pods not becoming ready)
    - alert: DeploymentRolloutStuck
      expr: |
        kube_deployment_status_replicas_updated
        !=
        kube_deployment_spec_replicas
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout stuck"
        description: "Rollout has been progressing for 10 minutes. Pods may be failing to start."

  # ── On-call health (meta-monitoring) ─────────────────────────
  - name: oncall-meta
    rules:
    # Alert if Prometheus itself is not scraping correctly
    - alert: PrometheusNotScraping
      expr: up == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}"

    # Alert if Alertmanager is not receiving alerts
    - alert: AlertmanagerDown
      expr: absent(up{job="alertmanager"}) == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Alertmanager is down — alerts will not be routed!"
