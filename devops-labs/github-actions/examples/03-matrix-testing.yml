# Example 03: Matrix Testing — Multiple OS, Python Versions, and Databases
# Path: .github/workflows/matrix-test.yml

name: Matrix Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']
        db: [postgres, sqlite]
        exclude:
          # Don't test postgres on macOS (heavier setup, save minutes)
          - os: macos-latest
            db: postgres
        include:
          # Add extra env for specific combination
          - os: ubuntu-latest
            python: '3.12'
            db: postgres
            run-coverage: true    # Only upload coverage once

    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:15-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Set database URL
      run: |
        if [ "${{ matrix.db }}" = "postgres" ]; then
          echo "DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/testdb" >> $GITHUB_ENV
        else
          echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
        fi

    - name: Run tests
      run: |
        pytest tests/ \
          -v \
          --cov=src \
          --cov-report=xml \
          -m "not slow"

    - name: Upload coverage
      if: matrix.run-coverage == true
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml
        flags: python${{ matrix.python }}-${{ matrix.db }}

  # Only runs when ALL matrix jobs pass
  matrix-success:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: All matrix jobs passed
      if: needs.test.result == 'success'
      run: echo "✅ All matrix combinations passed!"
    - name: Some matrix jobs failed
      if: needs.test.result != 'success'
      run: |
        echo "❌ Some matrix jobs failed!"
        exit 1
