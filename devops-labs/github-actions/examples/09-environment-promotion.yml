# Example 09: Environment Promotion Pipeline
# dev → staging → production with approval gates

name: Environment Promotion

on:
  push:
    branches: [main]

jobs:
  # ── Build once ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      sha: ${{ github.sha }}

    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: push
      run: |
        IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
        docker buildx build --push --tag $IMAGE .
        echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ── Deploy to dev (auto) ──────────────────────────────────────
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.company.com

    steps:
    - uses: actions/checkout@v4
    - name: Deploy to dev
      run: |
        echo "Deploying ${{ needs.build.outputs.image }} to dev"
        # kubectl set image deployment/app app=${{ needs.build.outputs.image }} -n dev
        echo "✅ Dev deployment complete"

    - name: Run smoke tests
      run: |
        sleep 10
        # curl -sf https://dev.company.com/health
        echo "✅ Smoke tests passed"

    - name: Run integration tests
      run: |
        # pytest tests/integration/ --base-url=https://dev.company.com
        echo "✅ Integration tests passed"

  # ── Deploy to staging (auto, after dev) ──────────────────────
  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.company.com

    steps:
    - uses: actions/checkout@v4
    - name: Deploy to staging
      run: |
        echo "Deploying ${{ needs.build.outputs.image }} to staging"
        # kubectl set image deployment/app app=${{ needs.build.outputs.image }} -n staging
        echo "✅ Staging deployment complete"

    - name: Run E2E tests
      run: |
        # npx playwright test --base-url=https://staging.company.com
        echo "✅ E2E tests passed"

    - name: Performance baseline
      run: |
        # k6 run --env BASE_URL=https://staging.company.com load-test.js
        echo "✅ Performance baseline passed"

  # ── Deploy to production (manual approval required) ───────────
  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production    # ← Human approval required in GitHub settings
      url: https://api.company.com

    steps:
    - uses: actions/checkout@v4

    - name: Pre-deploy checklist
      run: |
        echo "### Pre-Deploy Checklist" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Build passed" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Dev tests passed" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Staging tests passed" >> $GITHUB_STEP_SUMMARY
        echo "- [x] Human approved" >> $GITHUB_STEP_SUMMARY

    - name: Deploy to production
      run: |
        echo "Deploying ${{ needs.build.outputs.image }} to production"
        # kubectl set image deployment/app app=${{ needs.build.outputs.image }} -n production
        # kubectl rollout status deployment/app -n production --timeout=10m

    - name: Production health check
      run: |
        sleep 30
        # for i in 1 2 3; do
        #   curl -sf https://api.company.com/health && echo "Check $i/3 passed"
        #   sleep 10
        # done
        echo "✅ Production health checks passed"

    - name: Rollback on failure
      if: failure()
      run: |
        echo "❌ Deployment failed! Rolling back..."
        # kubectl rollout undo deployment/app -n production

    - name: Update deployment tracking
      if: success()
      run: |
        echo "Deployment complete!"
        echo "- Image: ${{ needs.build.outputs.image }}" >> $GITHUB_STEP_SUMMARY
        echo "- SHA: ${{ needs.build.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY
