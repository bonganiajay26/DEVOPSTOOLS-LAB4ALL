# Example 04: Docker Build and Push to Multiple Registries
# Builds once, pushes to GHCR + AWS ECR + DockerHub

name: Docker Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: myapp

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # OIDC for AWS

    steps:
    - uses: actions/checkout@v4

    # Set up QEMU for multi-platform builds (linux/amd64 + linux/arm64)
    - uses: docker/setup-qemu-action@v3

    - uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host
          image=moby/buildkit:v0.12.0

    # Login to GitHub Container Registry
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Login to DockerHub
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Login to AWS ECR (using OIDC)
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::123456789:role/github-ecr-push
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    # Generate image metadata (tags + labels)
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: |
          ghcr.io/${{ github.repository }}
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}
        tags: |
          # Branch → latest
          type=raw,value=latest,enable={{is_default_branch}}
          # Git SHA short
          type=sha,format=short
          # Semantic version (from v1.2.3 tag)
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        labels: |
          org.opencontainers.image.title=MyApp
          org.opencontainers.image.description=Production API Service
          org.opencontainers.image.vendor=MyCompany

    # Build and push to ALL registries in one step
    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: production
        push: true
        platforms: linux/amd64,linux/arm64    # Multi-arch
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Generate SBOM and provenance attestations
        sbom: true
        provenance: mode=max
        # Build args
        build-args: |
          BUILD_DATE=${{ github.event.repository.updated_at }}
          GIT_SHA=${{ github.sha }}

    # Output image digest for downstream jobs
    - name: Output digest
      run: |
        echo "Image digest: ${{ steps.build.outputs.digest }}"
        echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

    # Notify on failure
    - name: Alert on failure
      if: failure()
      uses: slackapi/slack-github-action@v1.26.0
      with:
        channel-id: C0BUILDS
        slack-message: "❌ Docker build failed for ${{ github.repository }} on ${{ github.ref }}"
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
