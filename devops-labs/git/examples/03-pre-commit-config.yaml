# Example 03: pre-commit Framework Configuration
# Install: pip install pre-commit
# Setup:   pre-commit install
# Run:     pre-commit run --all-files

repos:
# ── Standard hooks ────────────────────────────────────────────
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace        # Remove trailing whitespace
  - id: end-of-file-fixer          # Ensure files end with newline
  - id: check-yaml                 # Validate YAML syntax
  - id: check-json                 # Validate JSON syntax
  - id: check-toml                 # Validate TOML syntax
  - id: check-xml                  # Validate XML syntax
  - id: check-merge-conflict       # Detect leftover merge conflict markers
  - id: check-added-large-files    # Prevent large files (default 500KB)
    args: ['--maxkb=1000']
  - id: detect-private-key         # Scan for private keys
  - id: check-case-conflict        # Prevent case-insensitive filename conflicts
  - id: mixed-line-ending          # Normalize line endings
    args: ['--fix=lf']
  - id: no-commit-to-branch        # Prevent direct commits to protected branches
    args: ['--branch', 'main', '--branch', 'master', '--branch', 'production']

# ── Secret detection ──────────────────────────────────────────
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.4.0
  hooks:
  - id: detect-secrets
    args: ['--baseline', '.secrets.baseline']
    exclude: '(package-lock\.json|\.secrets\.baseline)'

# ── Python linting ────────────────────────────────────────────
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.2.0
  hooks:
  - id: ruff                       # Python linter (replaces flake8, isort, pylint)
    args: [--fix]
  - id: ruff-format                # Python formatter (replaces black)

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.8.0
  hooks:
  - id: mypy                       # Python type checker
    additional_dependencies: [types-requests, types-PyYAML]
    args: [--strict, --ignore-missing-imports]

# ── YAML/JSON/Markdown formatting ─────────────────────────────
- repo: https://github.com/prettier/prettier
  rev: v3.2.4
  hooks:
  - id: prettier
    types_or: [yaml, json, markdown]
    args: [--prose-wrap, always]

# ── Dockerfile linting ────────────────────────────────────────
- repo: https://github.com/hadolint/hadolint
  rev: v2.12.0
  hooks:
  - id: hadolint-docker
    args: [--ignore, DL3008, --ignore, DL3009]

# ── Shell scripts ─────────────────────────────────────────────
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
  - id: shellcheck

# ── Terraform ─────────────────────────────────────────────────
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.86.0
  hooks:
  - id: terraform_fmt
  - id: terraform_validate
  - id: terraform_tflint

# ── Kubernetes/Helm ───────────────────────────────────────────
- repo: https://github.com/gruntwork-io/pre-commit
  rev: v0.1.23
  hooks:
  - id: helmlint

# ── Commit message validation ─────────────────────────────────
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.2.0
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
    args: [feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert]
