# Example 06: RBAC — Role-Based Access Control
# Principle of least privilege. Every SA gets only what it needs.

---
# ServiceAccount — identity for a workload
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-sa
  namespace: production
  annotations:
    # AWS IRSA: bind to IAM role for AWS API access
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/api-service-role"
automountServiceAccountToken: false  # Opt-in only — don't auto-mount in every pod

---
# Role — namespaced permissions (production namespace only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-service-role
  namespace: production
rules:
# Can read ConfigMaps and Secrets (for config loading)
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Can read its own pod info
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
# RoleBinding — assigns Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-service-rolebinding
  namespace: production
subjects:
- kind: ServiceAccount
  name: api-service-sa
  namespace: production
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: api-service-role

---
# ClusterRole — cluster-wide permissions (non-namespaced resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-reader
rules:
# Prometheus needs to discover all pods/services/endpoints cluster-wide
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics", "services",
              "endpoints", "pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]

---
# ClusterRoleBinding — assigns ClusterRole cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-monitoring
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: monitoring-reader

---
# Developer Role — read-only access to production (common pattern)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-readonly
  namespace: production
rules:
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "deployments", "replicasets", "services",
              "configmaps", "events", "jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]       # Allow exec into pods
  verbs: ["create"]

---
# Bind developer group to readonly role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-readonly-binding
  namespace: production
subjects:
- kind: Group                        # OIDC group from your identity provider
  name: "engineering-team"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: developer-readonly

---
# CI/CD Service Account — deploy to staging only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-deployer
  namespace: staging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-deploy-role
  namespace: staging
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deploy-binding
  namespace: staging
subjects:
- kind: ServiceAccount
  name: cicd-deployer
  namespace: staging
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: cicd-deploy-role

# Generate kubeconfig for CI/CD SA:
# kubectl create token cicd-deployer -n staging --duration=8760h
