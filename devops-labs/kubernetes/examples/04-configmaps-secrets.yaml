# Example 04: ConfigMaps & Secrets
# Patterns: env vars, volume mounts, hot-reload, external secrets

---
# ConfigMap — as environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-service-config
  namespace: production
data:
  # Simple key-value pairs
  APP_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8080"
  MAX_CONNECTIONS: "100"
  FEATURE_FLAG_DARK_MODE: "true"

  # Multiline value (config file)
  app.properties: |
    server.port=8080
    spring.datasource.pool.size=20
    spring.cache.type=redis
    management.endpoints.web.exposure.include=health,info,metrics

  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      upstream backend {
        server api-service:8080;
        keepalive 32;
      }
      server {
        listen 80;
        location / {
          proxy_pass http://backend;
          proxy_http_version 1.1;
        }
      }
    }

---
# Mount ConfigMap as files in a volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-config
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-with-config
  template:
    metadata:
      labels:
        app: nginx-with-config
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        volumeMounts:
        # Mount specific key as file
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf          # Only mount this key, not all keys
          readOnly: true
        # Mount all keys as files in a directory
        - name: app-config
          mountPath: /etc/app-config
          readOnly: true
        # Env vars from ConfigMap
        envFrom:
        - configMapRef:
            name: api-service-config

      volumes:
      - name: nginx-config
        configMap:
          name: api-service-config
      - name: app-config
        configMap:
          name: api-service-config
          defaultMode: 0644           # File permissions

---
# Secrets — basic types
# IMPORTANT: Base64 is encoding, NOT encryption.
# Use Sealed Secrets or External Secrets Operator for real secret management.

apiVersion: v1
kind: Secret
metadata:
  name: api-service-secrets
  namespace: production
  labels:
    app: api-service
type: Opaque
stringData:                           # Use stringData — auto base64 encodes
  database-url: "postgresql://user:password@postgres:5432/mydb?sslmode=require"
  jwt-secret: "super-secret-jwt-key-change-in-production"
  redis-url: "redis://:password@redis:6379/0"

---
# TLS Secret (certificate + key)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: production
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-cert>
  tls.key: <base64-encoded-key>

---
# Docker registry credentials
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: production
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-encoded-docker-config>

# Generate with:
# kubectl create secret docker-registry registry-credentials \
#   --docker-server=myregistry.io \
#   --docker-username=myuser \
#   --docker-password=mypassword \
#   --docker-email=me@company.com \
#   -n production

---
# External Secrets Operator — sync secrets from AWS Secrets Manager / Vault
# Install: helm install external-secrets external-secrets/external-secrets -n external-secrets-system
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        serviceAccount:
          name: external-secrets-sa    # IRSA — IAM role bound to K8s SA

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-service-secrets-ext
  namespace: production
spec:
  refreshInterval: 1h                  # Re-sync from AWS every hour
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: api-service-secrets          # Creates this K8s Secret
    creationPolicy: Owner
  data:
  - secretKey: database-url            # K8s Secret key
    remoteRef:
      key: prod/api-service/database   # AWS Secret name
      property: url                    # JSON property inside the secret
  - secretKey: jwt-secret
    remoteRef:
      key: prod/api-service/auth
      property: jwt_secret
