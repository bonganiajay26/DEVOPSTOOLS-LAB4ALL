# Example 01: Full Azure Pipelines CI/CD — Test → ACR → AKS
# Path: azure-pipelines.yml

trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - docs/**
    - '*.md'

pr:
  branches:
    include:
    - main

variables:
  containerRegistry: 'my-acr-service-connection'  # Service connection name
  imageRepository: 'myapp'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'
  pythonVersion: '3.12'
  acrName: 'mycompanyacr'
  aksCluster: 'myaks-production'
  resourceGroup: 'myapp-rg'

stages:
# ── Stage 1: Lint and Test ──────────────────────────────────────
- stage: Test
  displayName: Test
  jobs:
  - job: Lint
    displayName: Lint
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)
        addToPath: true

    - script: |
        pip install ruff black
        ruff check .
        black --check .
      displayName: Lint Python

  - job: UnitTests
    displayName: Unit Tests
    pool:
      vmImage: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - task: Cache@2
      inputs:
        key: '"pip" | "$(Agent.OS)" | requirements.txt'
        restoreKeys: '"pip" | "$(Agent.OS)"'
        path: $(pip_cache_dir)
      displayName: Cache pip

    - script: pip install -r requirements.txt -r requirements-dev.txt
      displayName: Install dependencies

    - script: |
        pytest tests/ \
          -v \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=test-results.xml
      displayName: Run tests
      env:
        DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'test-results.xml'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: coverage.xml
        reportDirectory: htmlcov

# ── Stage 2: Security Scan ─────────────────────────────────────
- stage: Security
  displayName: Security Scan
  dependsOn: Test
  jobs:
  - job: ScanDependencies
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        pip install pip-audit
        pip-audit --requirement requirements.txt
      displayName: Scan dependencies

  - job: ScanSecrets
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline
      displayName: Scan for secrets

# ── Stage 3: Build and Push ────────────────────────────────────
- stage: Build
  displayName: Build and Push
  dependsOn: Security
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: BuildPush
    displayName: Build and Push to ACR
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(containerRegistry)

    - task: Docker@2
      displayName: Build image
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(containerRegistry)
        tags: |
          $(tag)
          latest
        arguments: '--target production --cache-from $(acrName).azurecr.io/$(imageRepository):latest'

    - task: AquaSecurityTrivy.trivy.trivy-task.trivy@1
      displayName: Scan with Trivy
      inputs:
        version: latest
        loginDockerConfig: true
        image: $(acrName).azurecr.io/$(imageRepository):$(tag)
        exitCode: 1
        severity: CRITICAL
      continueOnError: false

    - task: Docker@2
      displayName: Push image
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(containerRegistry)
        tags: |
          $(tag)
          latest

# ── Stage 4: Deploy to Staging ─────────────────────────────────
- stage: DeployStaging
  displayName: Deploy to Staging
  dependsOn: Build
  variables:
  - group: staging-variables
  jobs:
  - deployment: DeployToStaging
    displayName: Deploy to AKS Staging
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Get AKS credentials
            inputs:
              azureSubscription: 'my-azure-subscription'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(resourceGroup) \
                  --name $(aksCluster)-staging \
                  --overwrite-existing

          - task: KubernetesManifest@1
            displayName: Update image tag
            inputs:
              action: deploy
              namespace: staging
              manifests: k8s/*.yaml
              containers: |
                $(acrName).azurecr.io/$(imageRepository):$(tag)

          - task: KubernetesManifest@1
            displayName: Check rollout
            inputs:
              action: reject
              namespace: staging
              manifests: k8s/deployment.yaml

          - script: |
              sleep 15
              kubectl rollout status deployment/myapp -n staging --timeout=5m
            displayName: Wait for rollout

          - script: curl -sf https://staging.company.com/health
            displayName: Smoke test

# ── Stage 5: Deploy to Production (requires approval) ──────────
- stage: DeployProduction
  displayName: Deploy to Production
  dependsOn: DeployStaging
  variables:
  - group: production-variables
  - group: production-keyvault-secrets   # Linked to Key Vault
  jobs:
  - deployment: DeployToProduction
    displayName: Deploy to AKS Production
    environment: production              # Must be approved in Azure DevOps
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        preDeploy:
          steps:
          - script: echo "Starting production deployment of $(imageRepository):$(tag)"
        deploy:
          steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'my-azure-subscription'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(resourceGroup) \
                  --name $(aksCluster) \
                  --overwrite-existing
                kubectl set image deployment/myapp \
                  app=$(acrName).azurecr.io/$(imageRepository):$(tag) \
                  -n production
                kubectl rollout status deployment/myapp -n production --timeout=10m

          - script: |
              for i in 1 2 3; do
                curl -sf https://api.company.com/health && echo "Check $i passed"
                sleep 5
              done
            displayName: Production health checks

        on:
          failure:
            steps:
            - task: AzureCLI@2
              inputs:
                azureSubscription: 'my-azure-subscription'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: kubectl rollout undo deployment/myapp -n production
              displayName: Rollback on failure
