# Full-stack development environment
# Start: docker compose up -d
# Logs:  docker compose logs -f api
# Stop:  docker compose down

name: myapp

services:

  # ── API ──────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      target: development           # Use dev stage (includes dev tools + live reload)
    ports:
      - "3000:3000"                 # API
      - "9229:9229"                 # Node.js debugger
    volumes:
      - ./api/src:/app/src          # Live code reload
      - api_node_modules:/app/node_modules  # Named volume (faster than bind mount)
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://appuser:devpassword@postgres:5432/appdb
      - REDIS_URL=redis://:redispassword@redis:6379/0
      - JWT_SECRET=dev-only-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    # Resource limits (avoid one container starving others)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"                 # Vite dev server
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - frontend
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"                 # Exposed for local GUI tools (TablePlus, DBeaver)
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d  # Run SQL scripts on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redispassword --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # ── Monitoring (dev) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
    profiles:
      - monitoring               # Only starts with: docker compose --profile monitoring up

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - backend
    profiles:
      - monitoring

  # ── DB Admin UI ───────────────────────────────────────────────
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    networks:
      - backend
    profiles:
      - tools                    # Only starts with: docker compose --profile tools up

networks:
  frontend:
  backend:

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  grafanadata:
    driver: local
  api_node_modules:
    driver: local
