# Example 01: ArgoCD Application Patterns
# Complete collection of real-world ArgoCD configurations

---
# ── 1. Basic Application (Kustomize) ─────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-service-production
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: alerts
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: production
  source:
    repoURL: https://github.com/myorg/gitops-repo
    targetRevision: main
    path: apps/api-service/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas    # HPA manages replicas
  revisionHistoryLimit: 10

---
# ── 2. Helm Application ───────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.9.1"
    helm:
      releaseName: nginx-ingress
      valueFiles:
      - values-production.yaml
      values: |
        controller:
          replicaCount: 3
          service:
            type: LoadBalancer
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: false    # Don't auto-prune infra components
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

---
# ── 3. ApplicationSet — one app per cluster ───────────────────
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-all-clusters
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          environment: production
  template:
    metadata:
      name: "{{name}}-guestbook"
    spec:
      project: production
      source:
        repoURL: https://github.com/myorg/gitops-repo
        targetRevision: main
        path: apps/guestbook/overlays/{{metadata.labels.environment}}
      destination:
        server: "{{server}}"
        namespace: guestbook
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

---
# ── 4. ApplicationSet — matrix generator ─────────────────────
# Creates apps for each service × environment combination
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-matrix
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - service: api-service
            team: backend
          - service: frontend
            team: web
          - service: worker
            team: backend
      - list:
          elements:
          - env: staging
            cluster: staging-cluster
          - env: production
            cluster: production-cluster
  template:
    metadata:
      name: "{{env}}-{{service}}"
      labels:
        team: "{{team}}"
    spec:
      project: "{{env}}"
      source:
        repoURL: https://github.com/myorg/gitops-repo
        targetRevision: main
        path: "apps/{{service}}/overlays/{{env}}"
      destination:
        server: "https://{{cluster}}-api.company.com"
        namespace: "{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

---
# ── 5. AppProject — security boundary ────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production
  namespace: argocd
spec:
  description: Production applications
  sourceRepos:
  - https://github.com/myorg/gitops-repo
  - https://charts.bitnami.com/bitnami
  destinations:
  - namespace: production
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
  namespaceResourceWhitelist:
  - group: apps
    kind: Deployment
  - group: ""
    kind: Service
  - group: ""
    kind: ConfigMap
  - group: ""
    kind: ServiceAccount
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: networking.k8s.io
    kind: Ingress
  orphanedResources:
    warn: true
    ignore:
    - group: ""
      kind: ConfigMap
      name: kube-root-ca.crt

---
# ── 6. Sync Waves — ordered deployment ───────────────────────
# Apply CRDs first, then operators, then applications
# Lower wave numbers apply first

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-10"  # Apply first (infra)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # Apply after cert-manager

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"    # Default wave (apps)

---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync      # Run before sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"   # Before app deployment
